<!doctype html>
<html>
  <head>
    <title>給80914的小禮物</title>
  </head>
  <body>
    <script>
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      function print (text) {
        document.body.innerHTML += text;
      }
      
      async function main() {
        print("正在建立連線，請勿關閉網頁...");
        await sleep(2000);
        print("連線建立成功，正在載入相關套件...");
        await sleep(2000);
        for (let i = 0; i < 1000; i++) {
          print(`載入套件 Package-${Math.random()*1000}...`);
          await sleep(5);
          print(`套件 Package-${Math.random()*1000} 載入完成。`);
        }
        await sleep(2000);
        print("正在連接C2伺服器...");
        await sleep(1000);
        print("連線重置中，請稍後 (1/3)");
        await sleep(1000);
        print("連線重置中，請稍後 (2/3)");
        await sleep(1000);
        print("連線重置中，請稍後 3/3)");
        await sleep(1000);
        print("連線完成。");
        await sleep(2500);
        for (let i = 0; i < 10000000000000000000; i++) {
          alert(`程式碼執行中: getcmd execute prework ${Math.random()*1000*Math.random()*1000}`);
        }
      }

      main();
    </script>
  </body>
</html>
