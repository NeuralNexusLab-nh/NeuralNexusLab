<!DOCTYPE html>
<html>
<head>
  <title>SSO Test</title>
</head>
<body>
  <script>
    fetch("https://sso.ntpc.edu.tw/Profile.ashx", {
      credentials: "include"
    })
    .then(res => res.text())
    .then(data => {
      document.body.innerText = data;
    })
    .catch(err => {
      console.error("Fetch failed:", err);
    });
  </script>
</body>
</html>
