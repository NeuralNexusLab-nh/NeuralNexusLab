<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.mymemory.translated.net; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0c0e13">
  <meta name="description" content="PiPlex by NXLabTW. A focused, two-way translator with 33 languages. English to Traditional Chinese by default.">
  <meta property="og:title" content="PiPlex Translate — NXLabTW">
  <meta property="og:description" content="A focused, two-way translator. 33 languages, either direction.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nxlabtw.com/piplex.html">
  <meta property="og:site_name" content="NXLabTW">
  <title>PiPlex Translate — NXLabTW</title>
  <link rel="canonical" href="https://nxlabtw.com/piplex.html">
  <link rel="icon" href="assets/nx-logo-imagegen-final.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/piplex.css">
  <script type="module" src="assets/piplex.js"></script>
</head>
<body>
  <a class="skip-link" href="#translator">Skip to translator</a>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    </defs>
  </svg>

  <header class="site-header">
    <nav class="top-nav shell" aria-label="Main navigation">
      <a class="product-brand" href="piplex.html" aria-current="page"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 23V8h9a6 6 0 0 1 0 12h-4M26 9v15h-9a6 6 0 0 1 0-12h4"/></svg>PiPlex</a>
      <a class="company-link" href="./" aria-label="NXLabTW homepage">NXLabTW <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </nav>
  </header>

  <main class="shell">
    <div class="page-heading"><h1>Translate</h1><span>33 languages</span></div>
    <section class="translator" id="translator" aria-label="Two-way text translator">
      <div class="workspace-heading">
        <span class="workspace-title"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>Text</span>
        <label class="auto-control"><span>Auto-translate</span><input id="auto-translate" type="checkbox" role="switch" aria-describedby="privacy-note"><span class="switch-track" aria-hidden="true"></span></label>
      </div>
      <div class="language-bar">
        <div class="language-choice">
          <label class="visually-hidden" for="source-language">Left language</label>
          <select id="source-language" aria-label="Left language"><option value="en">English</option></select>
          <span class="language-code" id="left-code">EN</span>
        </div>
        <button class="swap-button" id="swap-languages" type="button" aria-label="Swap languages and text" title="Swap languages and text"><svg class="icon" aria-hidden="true"><use href="#i-swap"/></svg></button>
        <div class="language-choice">
          <label class="visually-hidden" for="target-language">Right language</label>
          <select id="target-language" aria-label="Right language"><option value="zh-TW">Traditional Chinese</option></select>
          <span class="language-code" id="right-code">ZH-TW</span>
        </div>
      </div>
      <div class="editor-grid">
        <div class="editor-panel" id="left-panel" data-role="source">
          <div class="panel-heading"><span class="role-label" id="left-role">Source</span><button class="icon-button clear-button" id="clear-left" type="button" aria-label="Clear left text" title="Clear" disabled><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
          <label class="visually-hidden" for="left-text">Left text. Type to translate to the right.</label>
          <textarea id="left-text" lang="en" dir="auto" placeholder="Enter text…" spellcheck="false" aria-describedby="left-counter translation-limit"></textarea>
          <div class="panel-footer"><button class="icon-button copy-button" id="copy-left" type="button" aria-label="Copy left text" title="Copy" disabled><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button><span class="copy-feedback" id="left-copy-feedback" role="status"></span><span class="character-count" id="left-counter">0 / 500 bytes</span></div>
        </div>
        <div class="editor-panel" id="right-panel" data-role="translation">
          <div class="panel-heading"><span class="role-label" id="right-role">Translation</span><button class="icon-button clear-button" id="clear-right" type="button" aria-label="Clear right text" title="Clear" disabled><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
          <label class="visually-hidden" for="right-text">Right text. Type to translate to the left.</label>
          <textarea id="right-text" lang="zh-TW" dir="auto" placeholder="Translation…" spellcheck="false" aria-describedby="right-counter translation-limit"></textarea>
          <div class="panel-footer"><button class="icon-button copy-button" id="copy-right" type="button" aria-label="Copy right text" title="Copy" disabled><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button><span class="copy-feedback" id="right-copy-feedback" role="status"></span><span class="character-count" id="right-counter">0 / 500 bytes</span></div>
        </div>
      </div>
      <div class="workspace-actions">
        <div class="translation-state" id="translation-state" role="status" aria-live="polite" aria-atomic="true"><span class="status-indicator" aria-hidden="true"></span><span id="status-text">Ready</span></div>
        <div class="action-group"><span class="keyboard-hint" id="keyboard-hint"><kbd>Ctrl</kbd> <kbd>↵</kbd></span><button class="translate-button" id="translate-button" type="button" disabled><span id="translate-label">Translate</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
      </div>
    </section>
    <div class="workspace-notes"><p id="privacy-note">Text is sent to MyMemory. Avoid sensitive information.</p><p id="translation-limit">500 UTF-8 bytes per translation</p></div>
    <noscript><p class="noscript-note">Enable JavaScript to use PiPlex.</p></noscript>
  </main>
  <footer class="site-footer shell"><span>PiPlex by <a href="./">NXLabTW</a></span><a href="https://mymemory.translated.net/doc/usagelimits.php" target="_blank" rel="noopener noreferrer">Service limits <span aria-hidden="true">↗</span></a></footer>
</body>
</html>
