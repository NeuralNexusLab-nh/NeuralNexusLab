<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail to Future</title>
    <!-- Google Fonts: 手寫體 + 等寬體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* --- 全域重設 & CRT 基底 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0a08;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Space Mono', monospace;
            color: #e6c28f;
            position: relative;
        }

        /* CRT 掃描線（懷舊硬體感） */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15) 0px,
                    rgba(0, 0, 0, 0.15) 2px,
                    transparent 2px,
                    transparent 6px);
            pointer-events: none;
            z-index: 999;
        }

        /* 微弱的暈影（暗角） */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
            pointer-events: none;
            z-index: 998;
        }

        .container {
            max-width: 820px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(13, 10, 8, 0.85);
            padding: 30px 35px 25px;
            border: 1px solid #3d2e1e;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(230, 194, 143, 0.06), inset 0 0 60px rgba(230, 194, 143, 0.03);
        }

        /* --- 頂部列：名稱 + 語言切換 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px dashed #3d2e1e;
            padding-bottom: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .site-title {
            font-family: 'Space Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #e6c28f;
            text-shadow: 0 0 8px rgba(230, 194, 143, 0.2);
        }
        .site-title span {
            color: #b88a5b;
            font-weight: 400;
        }
        /* 游標閃爍（駭客感） */
        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 26px;
            background: #e6c28f;
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            opacity: 0.7;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .lang-switch {
            display: flex;
            gap: 6px;
            background: #1a1410;
            padding: 4px 6px;
            border-radius: 30px;
            border: 1px solid #3d2e1e;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #7a6a5a;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 700;
        }
        .lang-btn.active {
            background: #e6c28f;
            color: #0d0a08;
        }
        .lang-btn:hover:not(.active) {
            color: #e6c28f;
        }

        /* --- 輸入區域 --- */
        .input-section {
            margin-bottom: 28px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .label-row label {
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #b88a5b;
        }
        .year-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .year-selector span {
            font-size: 13px;
            color: #7a6a5a;
        }
        .year-btn {
            background: transparent;
            border: 1px solid #3d2e1e;
            color: #b88a5b;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            padding: 3px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .year-btn.active {
            background: #3d2e1e;
            color: #e6c28f;
            border-color: #e6c28f;
        }
        .year-btn:hover:not(.active) {
            border-color: #e6c28f;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #1a1410;
            border: 1px solid #3d2e1e;
            border-radius: 8px;
            padding: 14px 16px;
            font-family: 'Space Mono', monospace;
            font-size: 15px;
            color: #e6c28f;
            resize: vertical;
            transition: 0.2s;
            outline: none;
        }
        textarea:focus {
            border-color: #e6c28f;
            box-shadow: 0 0 20px rgba(230, 194, 143, 0.05);
        }
        textarea::placeholder {
            color: #4a3f35;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .api-key-input {
            background: #1a1410;
            border: 1px solid #3d2e1e;
            border-radius: 20px;
            padding: 6px 16px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: #7a6a5a;
            outline: none;
            width: 200px;
            transition: 0.2s;
        }
        .api-key-input:focus {
            border-color: #e6c28f;
            color: #e6c28f;
        }
        .api-key-input::placeholder {
            color: #3d2e1e;
        }

        .send-btn {
            background: #e6c28f;
            border: none;
            color: #0d0a08;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 15px;
            padding: 10px 32px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(230, 194, 143, 0.1);
        }
        .send-btn:hover:not(:disabled) {
            background: #f0d6a8;
            box-shadow: 0 0 40px rgba(230, 194, 143, 0.25);
            transform: scale(1.02);
        }
        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        /* --- 免責聲明（終端機風） --- */
        .disclaimer {
            margin-top: 14px;
            padding: 10px 14px;
            border-left: 3px solid #5a3f2a;
            background: rgba(26, 20, 16, 0.6);
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: #5a4a3a;
            letter-spacing: 0.3px;
            line-height: 1.6;
        }
        .disclaimer strong {
            color: #7a5a3a;
        }

        /* --- 信件展示區（核心） --- */
        .letter-wrapper {
            margin-top: 10px;
            position: relative;
        }

        /* 信紙容器 — 動態展開高度 */
        .letter-paper {
            background: #fcf3e0;
            background-image: radial-gradient(circle at 20% 30%, rgba(235, 215, 185, 0.3) 0%, transparent 60%),
                linear-gradient(180deg, #fcf3e0 0%, #f5e8d0 100%);
            border-radius: 4px 4px 12px 12px;
            padding: 40px 48px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 240, 210, 0.3);
            max-height: 0;
            overflow: hidden;
            transition: max-height 1.2s cubic-bezier(0.22, 1, 0.36, 1), padding 0.6s ease;
            padding: 0 48px;
            /* 展開時才顯示 padding */;
            position: relative;
            min-height: 0;
        }

        /* 信紙打開後的內邊距 */
        .letter-paper.open {
            max-height: 1600px;
            /* 足夠容納長文 */
            padding: 40px 48px 35px;
        }

        /* 信紙頂部的「封蠟」裝飾（CSS 繪製） */
        .letter-paper::before {
            content: '✧';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #b55a3a;
            background: #fcf3e0;
            padding: 0 10px;
            opacity: 0;
            transition: opacity 1s 0.6s;
            text-shadow: 0 2px 8px rgba(181, 90, 58, 0.3);
        }
        .letter-paper.open::before {
            opacity: 1;
        }

        /* 信紙內文 — 手寫字體 */
        .letter-content {
            font-family: 'Caveat', 'KaiTi', '楷體', cursive;
            font-size: 24px;
            font-weight: 400;
            color: #2c241a;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
            opacity: 0;
            transition: opacity 0.8s ease;
            min-height: 100px;
        }
        .letter-paper.open .letter-content {
            opacity: 1;
        }

        /* 捲開時底部的「紙捲陰影」效果 */
        .letter-paper::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 5%;
            width: 90%;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(6px);
            opacity: 0;
            transition: opacity 1s 0.3s;
        }
        .letter-paper.open::after {
            opacity: 1;
        }

        /* 載入狀態（打字中的小記號） */
        .typing-cursor {
            display: inline-block;
            width: 4px;
            height: 28px;
            background: #2c241a;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            opacity: 0.6;
        }

        /* --- 響應式 --- */
        @media (max-width: 600px) {
            .container {
                padding: 18px 16px;
            }
            .site-title {
                font-size: 20px;
            }
            .letter-paper.open {
                padding: 30px 20px 25px;
            }
            .letter-content {
                font-size: 20px;
            }
            .api-key-input {
                width: 140px;
            }
            .action-row {
                flex-direction: column;
                align-items: stretch;
            }
            .send-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- 標頭 -->
        <header class="header">
            <div class="site-title">
                Mail <span>to</span> Future <span class="cursor-blink"></span>
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">繁中</button>
            </div>
        </header>

        <!-- 輸入區 -->
        <section class="input-section">
            <div class="label-row">
                <label data-i18n="label_question">> What's troubling you today?</label>
                <div class="year-selector">
                    <span data-i18n="label_year">Years:</span>
                    <button class="year-btn active" data-year="1">1</button>
                    <button class="year-btn" data-year="5">5</button>
                    <button class="year-btn" data-year="10">10</button>
                </div>
            </div>
            <textarea id="userInput" placeholder="e.g. I'm scared my startup is going to fail..." data-i18n-placeholder="placeholder_input"></textarea>

            <div class="action-row">
                <input type="password" class="api-key-input" id="apiKey" placeholder="sk-... (API Key)" />
                <button class="send-btn" id="sendBtn" data-i18n="btn_send">⌨ SEND TO FUTURE</button>
            </div>

            <!-- 免責聲明（終端機警告） -->
            <div class="disclaimer">
                <strong>[!]</strong> <span data-i18n="disclaimer">This letter is generated by AI. Content may be inaccurate, fictional, or absurd. Do not take it seriously. We assume no liability.</span>
            </div>
        </section>

        <!-- 信紙輸出 -->
        <div class="letter-wrapper">
            <div class="letter-paper" id="letterPaper">
                <div class="letter-content" id="letterContent">
                    <span class="typing-cursor" id="cursorEl"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 多語系字典 ---
        const i18n = {
            en: {
                label_question: '> What\'s troubling you today?',
                label_year: 'Years:',
                placeholder_input: 'e.g. I\'m scared my startup is going to fail...',
                btn_send: '⌨ SEND TO FUTURE',
                disclaimer: 'This letter is generated by AI. Content may be inaccurate, fictional, or absurd. Do not take it seriously. We assume no liability.',
                system_prompt: `You are the user's "Future Self" writing a letter back to them from the year {year} later.
                Follow these rules strictly:
                1. Write in a warm, empathetic tone (comfort them sincerely).
                2. MUST invent a specific, absurd, and slightly ridiculous "future event" that happened to them (e.g., "You'll win a hotdog eating contest by accident").
                3. End with a "P.S." that breaks the fourth wall or adds a playful punchline.
                4. Keep the total length around 150-200 words.
                5. Use casual, conversational English. Address the user as "you".
                6. IMPORTANT: The letter MUST start with "Dear {year}-year-older me," and end with "Yours, Future You".`
            },
            zh: {
                label_question: '> 你現在最煩惱的是什麼？',
                label_year: '年後：',
                placeholder_input: '例如：我好怕明天的面試會被刁難...',
                btn_send: '⌨ 寄給未來',
                disclaimer: '此信件由 AI 生成，內容可能不準確、虛構或荒謬。請勿輕信，本公司概不負責。',
                system_prompt: `你是使用者的「未來自我」，從 {year} 年後寫一封信回給現在的他/她。
                嚴格遵守以下規則：
                1. 語氣要溫暖真誠（給予真正的安慰）。
                2. 必須憑空捏造一個「具體且荒謬的未來事件」發生在他/她身上（例如：「你會因為在超商搶到最後一顆茶葉蛋而升職」）。
                3. 結尾必須有一個「P.S.」來打破第四面牆或補一個搞笑轉折。
                4. 總字數約 150~200 字。
                5. 使用口語化、輕鬆的繁體中文。稱呼使用者為「你」。
                6. 重要：開頭必須是「給 {year} 年後的自己：」，結尾必須是「未來的你 敬上」。`
            }
        };

        // --- 狀態 ---
        let currentLang = 'en';
        let currentYear = 1;
        let isSending = false;
        let abortController = null;

        // --- DOM 參考 ---
        const el = {
            langBtns: document.querySelectorAll('.lang-btn'),
            yearBtns: document.querySelectorAll('.year-btn'),
            userInput: document.getElementById('userInput'),
            apiKey: document.getElementById('apiKey'),
            sendBtn: document.getElementById('sendBtn'),
            letterPaper: document.getElementById('letterPaper'),
            letterContent: document.getElementById('letterContent'),
            cursorEl: document.getElementById('cursorEl'),
        };

        // --- 語言切換 ---
        function setLanguage(lang) {
            currentLang = lang;
            el.langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            // 更新所有 data-i18n 文字
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (i18n[lang][key] !== undefined) {
                    el.textContent = i18n[lang][key];
                }
            });
            // 更新 placeholder
            const placeholderKey = el.userInput.dataset.i18nPlaceholder;
            if (i18n[lang][placeholderKey] !== undefined) {
                el.userInput.placeholder = i18n[lang][placeholderKey];
            }
            // 更新按鈕文字（因為有特殊字元，用 textContent 取代）
            const btnKey = el.sendBtn.dataset.i18n;
            if (i18n[lang][btnKey] !== undefined) {
                el.sendBtn.textContent = i18n[lang][btnKey];
            }
            // 更新免責
            const disKey = document.querySelector('.disclaimer span').dataset.i18n;
            if (i18n[lang][disKey] !== undefined) {
                document.querySelector('.disclaimer span').textContent = i18n[lang][disKey];
            }
        }

        el.langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.dataset.lang);
            });
        });

        // --- 年份切換 ---
        el.yearBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                el.yearBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentYear = parseInt(btn.dataset.year);
            });
        });

        // --- 核心：寄信 ---
        el.sendBtn.addEventListener('click', async () => {
            if (isSending) return;
            const userText = el.userInput.value.trim();
            if (!userText) {
                alert(currentLang === 'en' ? 'Please write something first.' : '請先寫下你的煩惱。');
                return;
            }
            const apiKey = el.apiKey.value.trim();
            if (!apiKey) {
                alert(currentLang === 'en' ? 'Please enter your API Key.' : '請輸入你的 API Key。');
                return;
            }

            // 重置信件
            el.letterContent.innerHTML = '';
            el.letterPaper.classList.remove('open');
            // 強制 reflow
            void el.letterPaper.offsetWidth;

            isSending = true;
            el.sendBtn.disabled = true;
            el.sendBtn.textContent = currentLang === 'en' ? '⏳ SENDING...' : '⏳ 寄送中...';

            // 建立 system prompt
            const langData = i18n[currentLang];
            const sysPrompt = langData.system_prompt.replace(/{year}/g, currentYear);

            // 使用者訊息（根據語言）
            const userMsg = currentLang === 'en' ?
                `Here is my worry: ${userText}` :
                `這是我現在的煩惱：${userText}`;

            const messages = [
                { role: 'system', content: sysPrompt },
                { role: 'user', content: userMsg }
            ];

            try {
                abortController = new AbortController();
                const response = await fetch('https://intapi.zone.id/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini', // 可改成其他模型
                        messages: messages,
                        stream: true,
                        temperature: 0.85,
                        max_tokens: 600,
                    }),
                    signal: abortController.signal,
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API Error (${response.status}): ${errText}`);
                }

                // 打開信紙（展開動畫）
                el.letterPaper.classList.add('open');

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let fullContent = '';
                let isFirstChunk = true;

                // 移除游標
                el.cursorEl.style.display = 'none';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || trimmed === 'data: [DONE]') continue;
                        if (!trimmed.startsWith('data: ')) continue;

                        try {
                            const jsonStr = trimmed.replace(/^data: /, '');
                            const parsed = JSON.parse(jsonStr);
                            const delta = parsed.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullContent += delta;
                                // 逐字更新（以 20ms 間隔模擬手寫）
                                // 為了保持 Stream 即時感，我們直接更新，但要讓他 "慢慢" 顯示
                                // 用累積的方式一次性更新，但利用 requestAnimationFrame 或 setTimeout 製造延遲？
                                // 更好的作法：每收到一個 chunk 就追加，但字體排版不會跳。
                                el.letterContent.textContent = fullContent;
                                // 自動滾到底部（但因為信紙展開，維持 scroll）
                                el.letterContent.scrollTop = el.letterContent.scrollHeight;
                            }
                        } catch (e) {
                            // 忽略解析錯誤
                        }
                    }
                }

                // 結束，補上完整內容，確保沒有漏字
                el.letterContent.textContent = fullContent;

            } catch (error) {
                if (error.name === 'AbortError') {
                    el.letterContent.textContent = currentLang === 'en' ?
                        '✖ Transmission interrupted.' :
                        '✖ 傳輸中斷。';
                } else {
                    console.error(error);
                    el.letterContent.textContent = currentLang === 'en' ?
                        `✖ Error: ${error.message}` :
                        `✖ 錯誤：${error.message}`;
                }
                // 如果信紙還沒開，打開它顯示錯誤
                if (!el.letterPaper.classList.contains('open')) {
                    el.letterPaper.classList.add('open');
                }
            } finally {
                isSending = false;
                el.sendBtn.disabled = false;
                const btnKey = el.sendBtn.dataset.i18n;
                if (i18n[currentLang][btnKey] !== undefined) {
                    el.sendBtn.textContent = i18n[currentLang][btnKey];
                }
                abortController = null;
                // 移除游標（如果還留著）
                el.cursorEl.style.display = 'none';
            }
        });

        // --- 初始化 ---
        setLanguage('en');
        // 預設聚焦
        el.userInput.focus();

        // 視窗 resize 不影響
        console.log('📨 Mail to Future loaded. Write your worry, send it to your future self.');
    </script>

</body>
</html>
